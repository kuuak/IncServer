- name: Main nginx.conf
  ansible.builtin.copy: { src: nginx.conf, dest: /etc/nginx/nginx.conf, mode: "0644" }
  notify: Reload nginx

# Host -> app port for every Tenant Environment; app-locations.conf proxies to 127.0.0.1:$app_port.
# nginx.conf includes this file explicitly AND through conf.d/*.conf (as found; nginx -t is fine with it).
- name: Tenant port map
  ansible.builtin.template: { src: app-ports-map.conf.j2, dest: /etc/nginx/conf.d/app-ports-map.conf, mode: "0644" }
  notify: Reload nginx

# Ships with nginx-common. Asserted so that --check shows it missing (copy's check mode does not).
- name: Snippets directory
  ansible.builtin.file: { path: /etc/nginx/snippets, state: directory, mode: "0755" }

# Host -> X-Robots-Tag value, from each Environment's `noindex`. Used by tenant-headers.conf.
- name: Tenant X-Robots-Tag map
  ansible.builtin.template: { src: tenant-robots.conf.j2, dest: /etc/nginx/conf.d/tenant-robots.conf, mode: "0644" }
  notify: Reload nginx

# Security headers of every Tenant vhost, included by the vhosts and by app-locations.conf's /uploads/.
# This and the map come before app-locations.conf, which uses them.
- name: Tenant response headers
  ansible.builtin.copy: { src: tenant-headers.conf, dest: /etc/nginx/snippets/tenant-headers.conf, mode: "0644" }
  notify: Reload nginx

# Lives in sites-available (not enabled; included by every tenant vhost). Owner left as found (ubuntu).
- name: Shared tenant locations
  ansible.builtin.copy: { src: app-locations.conf, dest: /etc/nginx/sites-available/app-locations.conf, mode: "0644" }
  notify: Reload nginx

- name: Tool vhosts
  ansible.builtin.copy:
    src: "{{ item }}.conf"
    dest: "/etc/nginx/sites-available/{{ item }}.conf"
    mode: "0644"
  loop: "{{ nginx_tool_sites }}"
  notify: Reload nginx

- name: Enable tool vhosts
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item }}.conf"
    dest: "/etc/nginx/sites-enabled/{{ item }}.conf"
    state: link
  loop: "{{ nginx_tool_sites }}"
  notify: Reload nginx

- name: Catch-all default server
  ansible.builtin.copy: { src: 000-catch-all.conf, dest: /etc/nginx/sites-available/000-catch-all.conf, mode: "0644" }
  when: nginx_catch_all_enabled
  notify: Reload nginx

- name: Enable catch-all default server  # noqa: risky-file-permissions (a symlink, or removing one)
  ansible.builtin.file:
    src: "{{ '/etc/nginx/sites-available/000-catch-all.conf' if nginx_catch_all_enabled else omit }}"
    dest: /etc/nginx/sites-enabled/000-catch-all.conf
    state: "{{ 'link' if nginx_catch_all_enabled else 'absent' }}"
    force: "{{ ansible_check_mode }}"   # the src is not there yet during a first dry run; a real run copies it first
  notify: Reload nginx
