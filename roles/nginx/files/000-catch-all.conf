# Managed by Ansible (IncServer repo, roles/nginx). Answers any Host / SNI no vhost claims.
# HTTP: 444 (connection closed, no response). HTTPS: unknown or missing SNI gets a TLS
# "unrecognized_name" alert, so no certificate (e.g. mailhog's) is ever presented.
# http2 matches the vhosts' 443 listens (a mismatch makes nginx -t warn "protocol options redefined").
server {
	listen 80 default_server;
	listen [::]:80 default_server;
	listen 443 ssl http2 default_server;
	listen [::]:443 ssl http2 default_server;
	server_name _;
	ssl_reject_handshake on;
	return 444;
}
