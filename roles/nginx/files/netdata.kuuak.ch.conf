# Redirect all HTTP traffic to HTTPS
server {
	listen 80;
	listen [::]:80;
	server_name netdata.kuuak.ch;
	return 301 https://$host$request_uri;
}

# HTTPS main server block
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name netdata.kuuak.ch;

	# Basic Authentication Configuration
	auth_basic "Restricted Content";
	auth_basic_user_file /var/www/netdata.kuuak.ch/.htpasswd;

	access_log  /var/log/nginx/netdata.kuuak.ch-access.log;
	error_log   /var/log/nginx/netdata.kuuak.ch-error.log;

	root /var/www/netdata.kuuak.ch;
	index index.html index.htm;

	ssl_certificate /etc/letsencrypt/live/netdata.kuuak.ch/fullchain.pem; # managed by Certbot
	ssl_certificate_key /etc/letsencrypt/live/netdata.kuuak.ch/privkey.pem; # managed by Certbot
	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

	location / {
		proxy_pass http://localhost:19999;
	        proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
