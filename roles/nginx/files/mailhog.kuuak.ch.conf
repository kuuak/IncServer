# Redirect all HTTP traffic to HTTPS
server {
	listen 80;
	listen [::]:80;
	server_name mailhog.kuuak.ch;
	return 301 https://mailhog.kuuak.ch$request_uri;
}

# HTTPS main server block
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name mailhog.kuuak.ch;

	# Basic Authentication Configuration
	auth_basic "Restricted Content";
	auth_basic_user_file /var/www/mailhog.kuuak.ch/.htpasswd;

	access_log  /var/log/nginx/mailhog.kuuak.ch-access.log;
	error_log   /var/log/nginx/mailhog.kuuak.ch-error.log;

	ssl_certificate /etc/letsencrypt/live/mailhog.kuuak.ch/fullchain.pem; # managed by Certbot
	ssl_certificate_key /etc/letsencrypt/live/mailhog.kuuak.ch/privkey.pem; # managed by Certbot
	include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
	ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


	location / {
		proxy_pass http://127.0.0.1:8025;
	        proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
	}
}
