# Managed by Ansible (IncServer repo, roles/nginx). Response headers of every Tenant Environment's HTTPS server.
# Included at server level by each Tenant vhost, and again in app-locations.conf's /uploads/ location: a location
# with an add_header of its own inherits none from the server.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# "noindex, nofollow" on the Environments with `noindex: true` (conf.d/tenant-robots.conf); empty, so not sent, elsewhere.
add_header X-Robots-Tag $tenant_robots_tag always;
