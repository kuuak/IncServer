# Shared nginx configuration for delivery order apps
# This file contains common location blocks that can be included in server blocks
# Note: The map directive must be defined in the main nginx.conf http context

# Common location blocks
location /uploads/ {
	expires 1yd;  # Cache for 1 year
	add_header Cache-Control "public, max-age=31536000, immutable";
	access_log off;
	try_files $uri $uri/ =404;
}

# Next.js image optimization
location /_next/image {
	proxy_pass http://127.0.0.1:$app_port;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	# No Connection header for image requests
	proxy_set_header Connection "";
}

# Main proxy location
location / {
	proxy_pass http://127.0.0.1:$app_port;
	proxy_http_version 1.1;
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;

	# Handle WebSocket connections
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection 'upgrade';
}
