# Redirect all HTTP traffic to HTTPS www
server {
	listen 80;
	listen [::]:80;
	server_name pizzeria-peperoncini.ch www.pizzeria-peperoncini.ch;
	return 301 https://www.pizzeria-peperoncini.ch$request_uri;
}

# Redirect HTTPS non-www to HTTPS www
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name pizzeria-peperoncini.ch;

	ssl_certificate /etc/letsencrypt/live/pizzeria-peperoncini.ch/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pizzeria-peperoncini.ch/privkey.pem;

	include /etc/nginx/snippets/tenant-headers.conf;

	return 301 https://www.pizzeria-peperoncini.ch$request_uri;
}

# Main server block for HTTPS www
server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name www.pizzeria-peperoncini.ch;

	ssl_certificate /etc/letsencrypt/live/pizzeria-peperoncini.ch/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/pizzeria-peperoncini.ch/privkey.pem;

	access_log  /var/log/nginx/pizzeria-peperoncini.ch-access.log;
	error_log   /var/log/nginx/pizzeria-peperoncini.ch-error.log;

	root /var/www/pizzeria-peperoncini.ch/production/current/public;

	include /etc/nginx/snippets/tenant-headers.conf;

	# Specific redirects for old product URLs
	location ~ ^/commander/produit/(quatre-fromages|romana|rimini|chasseur|suxhuk|du-chef|bufala|capra|emiliana|venitienne|napoli|bresaola|hawai|tonno|la-bomba|vaudoise|capricciosa|diavola)/?$ {
		return 301 https://www.pizzeria-peperoncini.ch/commander/produit/pizza-$1;
	}

	# Specific redirect for privacy policy
	location = /protection-des-donnees {
		return 301 https://www.pizzeria-peperoncini.ch/declaration-de-confidentialite;
	}

	# Include shared location blocks
	include /etc/nginx/sites-available/app-locations.conf;
}
