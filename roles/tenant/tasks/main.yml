# One pass per Tenant Environment (see CONTEXT.md and the `tenants` var). Template for new Environments:
# docs/runbooks/2026-09-step8-staging-identity.sh is how Peperoncini's were made by hand.
#
# Not managed (yet): the Environment's app files and .env (deploys own them), TLS certificates (certbot).
# Deploy keys: one per Environment (`deploy_key`), GitHub Environment secret SSH_KEY holds the private half.

- name: Tenant domain directory
  ansible.builtin.file: { path: "/var/www/{{ item.domain }}", state: directory, owner: root, group: root, mode: "0755" }
  loop: "{{ tenants }}"
  loop_control: { label: "{{ item.domain }}" }

- name: Environment user (no password; `sudo -iu <user>`)
  ansible.builtin.user:
    name: "{{ item.1.user }}"
    home: "/var/www/{{ item.0.domain }}/{{ item.1.name }}"
    shell: /bin/bash
    create_home: false
  loop: "{{ tenants | subelements('environments') }}"
  loop_control: { label: "{{ item.1.user }}" }

- name: Environment home (0711, app in current/)
  ansible.builtin.file:
    path: "/var/www/{{ item.0.domain }}/{{ item.1.name }}"
    state: directory
    owner: "{{ item.1.user }}"
    group: "{{ item.1.user }}"
    mode: "0711"
  loop: "{{ tenants | subelements('environments') }}"
  loop_control: { label: "{{ item.1.user }}" }

- name: Private directories (.ssh, pre-deploy dumps)
  ansible.builtin.file:
    path: "/var/www/{{ item.0.0.domain }}/{{ item.0.1.name }}/{{ item.1 }}"
    state: directory
    owner: "{{ item.0.1.user }}"
    group: "{{ item.0.1.user }}"
    mode: "0700"
  loop: "{{ tenants | subelements('environments') | product(['.ssh', 'backups']) | list }}"
  loop_control: { label: "{{ item.0.1.user }} {{ item.1 }}" }

- name: Prune pre-deploy dumps (systemd-tmpfiles-clean, daily)
  ansible.builtin.template: { src: tmpfiles-backups.conf.j2, dest: /etc/tmpfiles.d/tenant-backups.conf, mode: "0644" }
  when: tenant_backups_max_age_days | int > 0

- name: No dump pruning
  ansible.builtin.file: { path: /etc/tmpfiles.d/tenant-backups.conf, state: absent }
  when: tenant_backups_max_age_days | int == 0

- name: Admin keys + deploy key (`restrict`)
  ansible.posix.authorized_key:
    user: "{{ item.1.user }}"
    key: "{{ (tenant_admin_keys + ['restrict ' ~ item.1.deploy_key]) | join('\n') }}"
    exclusive: "{{ tenant_authorized_keys_exclusive }}"
    manage_dir: false          # .ssh is the task above
  when: item.1.deploy_key is defined
  loop: "{{ tenants | subelements('environments') }}"
  loop_control: { label: "{{ item.1.user }}" }

# --- Node + PM2 ---------------------------------------------------------------------
# An Environment without `nvm_node_version` runs on the system Node 22 (role `nodejs`).
- name: System Node and PM2 present (role nodejs) before an Environment switches to them
  ansible.builtin.stat: { path: /usr/lib/node_modules/pm2/bin/pm2 }
  register: tenant_system_pm2
  when: tenants | map(attribute='environments') | flatten | rejectattr('nvm_node_version', 'defined') | list | length > 0

- name: Refuse to point a PM2 unit at a missing system PM2
  ansible.builtin.assert:
    that: tenant_system_pm2.stat.exists
    fail_msg: Run the nodejs role first (ansible-playbook site.yml --tags nodejs)
  when: tenant_system_pm2.stat is defined and not ansible_check_mode

# deploy-server.sh and refresh-staging.sh source ~/.nvm/nvm.sh when present, so a leftover nvm silently wins
# over the system Node. Renamed, not deleted, so a rollback is a `mv` back (delete in housekeeping).
- name: Retire per-user nvm on system-Node Environments
  ansible.builtin.command:
    argv: [mv, -T, "/var/www/{{ item.0.domain }}/{{ item.1.name }}/.nvm", "/var/www/{{ item.0.domain }}/{{ item.1.name }}/.nvm.retired"]
    removes: "/var/www/{{ item.0.domain }}/{{ item.1.name }}/.nvm"
  when: item.1.nvm_node_version is not defined
  loop: "{{ tenants | subelements('environments') }}"
  loop_control: { label: "{{ item.1.user }}" }

- name: PM2 unit
  ansible.builtin.template:
    src: pm2.service.j2
    dest: "/etc/systemd/system/pm2-{{ item.1.user }}.service"
    mode: "0644"
  loop: "{{ tenants | subelements('environments') }}"
  loop_control: { label: "pm2-{{ item.1.user }}" }
  notify: Reload systemd
  # No restart handler on purpose: restarting PM2 takes the Environment down. Restart by hand in a window.

- name: Flush handlers
  ansible.builtin.meta: flush_handlers

- name: Enable PM2 unit (not started here; a new Environment has no app yet)
  ansible.builtin.systemd: { name: "pm2-{{ item.1.user }}.service", enabled: true }
  loop: "{{ tenants | subelements('environments') }}"
  loop_control: { label: "pm2-{{ item.1.user }}" }
  ignore_errors: "{{ ansible_check_mode }}"   # the unit does not exist yet during a first dry run

# --- Postgres (psql as `postgres`; the box has no psycopg2 for the postgresql modules) ---------
- name: Read Postgres state
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, psql, -X, -At, -v, "u={{ item.1.user }}", -v, "d={{ item.1.db }}"]
    stdin: |
      SELECT (SELECT count(*) FROM pg_roles WHERE rolname = :'u' AND rolcanlogin AND NOT rolsuper AND NOT rolcreatedb)
        || '|' || coalesce((SELECT pg_get_userbyid(datdba) FROM pg_database WHERE datname = :'d'), '')
        || '|' || coalesce((SELECT has_database_privilege('public', datname, 'CONNECT')::text FROM pg_database WHERE datname = :'d'), '');
  register: tenant_pg
  changed_when: false
  check_mode: false
  loop: "{{ tenants | subelements('environments') }}"
  loop_control: { label: "{{ item.1.db }}" }

- name: DB owned by someone else needs a hand-made REASSIGN (see step 8 in docs/runbooks)
  ansible.builtin.fail:
    msg: "{{ item.item.1.db }} is owned by {{ item.stdout.split('|')[1] }}, expected {{ item.item.1.user }}"
  when: item.stdout.split('|')[1] not in ['', item.item.1.user]
  loop: "{{ tenant_pg.results }}"
  loop_control: { label: "{{ item.item.1.db }}" }

- name: Postgres drift (check mode reports, a real run fixes)
  ansible.builtin.debug:
    msg: >-
      {{ item.item.1.db }}: role ok={{ item.stdout.split('|')[0] == '1' }},
      db exists={{ item.stdout.split('|')[1] != '' }},
      PUBLIC can connect={{ item.stdout.split('|')[2] == 'true' }}
  changed_when: item.stdout != '1|' ~ item.item.1.user ~ '|false'
  when: ansible_check_mode
  loop: "{{ tenant_pg.results }}"
  loop_control: { label: "{{ item.item.1.db }}" }

- name: Create role / DB, revoke CONNECT from PUBLIC
  ansible.builtin.command:
    argv: [runuser, -u, postgres, --, psql, -X, -q, -v, ON_ERROR_STOP=1, -v, "u={{ item.item.1.user }}", -v, "d={{ item.item.1.db }}"]
    stdin: |
      \set pw '{{ vault_tenant_db_passwords[item.item.1.user] | default('') }}'
      SELECT format('CREATE ROLE %I LOGIN PASSWORD %L', :'u', :'pw') WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = :'u') \gexec
      ALTER ROLE :"u" LOGIN NOSUPERUSER NOCREATEDB;
      SELECT format('CREATE DATABASE %I OWNER %I', :'d', :'u') WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = :'d') \gexec
      REVOKE CONNECT ON DATABASE :"d" FROM PUBLIC;
  changed_when: true
  no_log: true
  when:
    - not ansible_check_mode
    - item.stdout != '1|' ~ item.item.1.user ~ '|false'
    # Never create a login role without its password
    - item.stdout.split('|')[0] == '1' or vault_tenant_db_passwords[item.item.1.user] | default('') | length > 0
  loop: "{{ tenant_pg.results }}"
  loop_control: { label: "{{ item.item.1.db }}" }

# --- Scheduled app jobs (POST /api/cron/<job>, handoff step 8) --------------------------
# Every `tenant_app_jobs` entry on every Environment, unless the Environment lists its own `app_jobs`. One service +
# timer each, app-<user>-<job>; the runner reads CRON_SECRET from the release's env files at run time.
- name: App job runner
  ansible.builtin.copy: { src: tenant-app-job, dest: /usr/local/sbin/tenant-app-job, mode: "0755" }

- name: App job units
  ansible.builtin.template:
    src: "app-job.{{ item.2 }}.j2"
    dest: "/etc/systemd/system/app-{{ item.0.1.user }}-{{ item.1.name }}.{{ item.2 }}"
    mode: "0644"
  when: item.1.name in (item.0.1.app_jobs | default(tenant_app_jobs | map(attribute='name')))
  loop: "{{ tenants | subelements('environments') | product(tenant_app_jobs) | product(['service', 'timer'])
            | map('flatten', levels=1) | list }}"
  loop_control: { label: "app-{{ item.0.1.user }}-{{ item.1.name }}.{{ item.2 }}" }
  notify: Reload systemd

- name: App job timers an Environment no longer runs
  ansible.builtin.stat: { path: "/etc/systemd/system/app-{{ item.0.1.user }}-{{ item.1.name }}.timer" }
  register: tenant_dropped_jobs
  when: item.1.name not in (item.0.1.app_jobs | default(tenant_app_jobs | map(attribute='name')))
  loop: "{{ tenants | subelements('environments') | product(tenant_app_jobs) | list }}"
  loop_control: { label: "app-{{ item.0.1.user }}-{{ item.1.name }}" }

- name: Stop them
  ansible.builtin.systemd: { name: "{{ item.stat.path | basename }}", enabled: false, state: stopped }
  when: item.stat.exists | default(false)
  loop: "{{ tenant_dropped_jobs.results }}"
  loop_control: { label: "{{ item.stat.path | default('-') | basename }}" }

- name: Remove their units
  ansible.builtin.file: { path: "/etc/systemd/system/app-{{ item.0.1.user }}-{{ item.1.name }}.{{ item.2 }}", state: absent }
  when: item.1.name not in (item.0.1.app_jobs | default(tenant_app_jobs | map(attribute='name')))
  loop: "{{ tenants | subelements('environments') | product(tenant_app_jobs) | product(['service', 'timer'])
            | map('flatten', levels=1) | list }}"
  loop_control: { label: "app-{{ item.0.1.user }}-{{ item.1.name }}.{{ item.2 }}" }
  notify: Reload systemd

- name: Flush handlers (app jobs)
  ansible.builtin.meta: flush_handlers

- name: Enable and start app job timers
  ansible.builtin.systemd: { name: "app-{{ item.0.1.user }}-{{ item.1.name }}.timer", enabled: true, state: started }
  when: item.1.name in (item.0.1.app_jobs | default(tenant_app_jobs | map(attribute='name')))
  loop: "{{ tenants | subelements('environments') | product(tenant_app_jobs) | list }}"
  loop_control: { label: "app-{{ item.0.1.user }}-{{ item.1.name }}.timer" }
  ignore_errors: "{{ ansible_check_mode }}"   # the units do not exist yet during a first dry run

# --- nginx --------------------------------------------------------------------------
- name: Vhost from the template
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: "/etc/nginx/sites-available/{{ item.1.host }}.conf"
    mode: "0644"
  when: item.1.vhost_file is not defined
  loop: "{{ tenants | subelements('environments') }}"
  loop_control: { label: "{{ item.1.host }}" }
  notify: Reload nginx

- name: Vhost shipped verbatim
  ansible.builtin.copy:
    src: "vhosts/{{ item.1.vhost_file }}"
    dest: "/etc/nginx/sites-available/{{ item.1.vhost_file }}"
    mode: "0644"
  when: item.1.vhost_file is defined
  loop: "{{ tenants | subelements('environments') }}"
  loop_control: { label: "{{ item.1.host }}" }
  notify: Reload nginx

- name: Enable vhost
  ansible.builtin.file:
    src: "/etc/nginx/sites-available/{{ item.1.vhost_file | default(item.1.host ~ '.conf') }}"
    dest: "/etc/nginx/sites-enabled/{{ item.1.vhost_file | default(item.1.host ~ '.conf') }}"
    state: link
  loop: "{{ tenants | subelements('environments') }}"
  loop_control: { label: "{{ item.1.host }}" }
  notify: Reload nginx
