# --- Hardening switches -------------------------------------------------------
# Everything that would change the box ships OFF, so the first run is a no-op against it.
# Turn one on, run with --check --diff, then apply. See docs/runbooks.

# Swap and OOM: as on the box since the 2026-09 cleanup.
swap_size_mb: 2048
swap_swappiness: 10
oom_protected_units: [ssh, systemd-journald, nginx, postgresql@16-main]

# sshd drop-in (role base): AllowUsers = these + every Environment user in `tenants`; anyone else is refused.
# A new Environment's deploy needs `--tags base` applied as well. Also: MaxAuthTries 3, no TCP/agent forwarding.
sshd_admin_users: [ubuntu]

# ufw is ON here (unlike KuuakServer), mirroring the box: 22/80/443 v4+v6 through the stock app profiles.
# Infomaniak's portal firewall sits in front as well. Docker-published ports bypass ufw: see mailpit_smtp_*.
firewall_enabled: true
firewall_allowed_apps: [OpenSSH, Nginx Full]

# Docker's json-file logs are unbounded without a daemon.json. On: 10 MB x 3 per container (#9). The role
# writes the file only; dockerd must be restarted by hand (it restarts every container, i.e. Mailpit), and
# a container keeps the log options it was created with: recreate it after that restart to pick them up.
docker_daemon_json_enabled: true

# nginx: a catch-all default_server (v4 + v6, 80 + 443) that answers unknown Host headers with 444 and rejects
# TLS handshakes for unknown or missing SNI. Off = the first vhost loaded (mailhog) answers them (Audit M2, #7).
nginx_catch_all_enabled: true

# --- Tools on the box (internal, behind nginx basic auth) ----------------------
nginx_tool_sites: [mailhog.kuuak.ch, netdata.kuuak.ch]

# Mailpit: catches all app mail (delivery-order-app ADR-0003: no mail leaves the box). Stays here.
mailpit_dir: /var/www/mailhog.kuuak.ch
# Pinned to what ran on 2026-10-16 (Mailpit API version v1.30.7; image digest sha256:d5ecbb06... = Docker Hub's
# v1.30.7). Bump it by hand: changing it recreates the container (the handler), i.e. a few seconds without SMTP.
mailpit_image: axllent/mailpit:v1.30.7
mailpit_state: started                  # started | stopped
# SMTP 1025 is published on 0.0.0.0 and Docker bypasses ufw. On = DOCKER-USER rules (IPv4; 1025 is not
# published on v6) that drop everyone but these two hosts, behind the portal firewall that does the same.
# Unit mailpit-smtp-filter (WantedBy + PartOf docker.service) rewrites them on every dockerd start/restart.
mailpit_smtp_filter_enabled: true
mailpit_smtp_allowed_v4:
  - 83.228.208.186     # IncServer
  - 83.228.217.113     # KuuakServer

# --- Tenants --------------------------------------------------------------------
# One entry per Tenant, one per Environment (see CONTEXT.md). Every Environment gets its own Unix user
# (no password; reach it with `sudo -iu <user>`), home /var/www/<domain>/<env> (0711, app in current/),
# PM2 unit, Postgres role owning its DB with CONNECT revoked from PUBLIC, and an nginx vhost + port-map line.
# Certificates are not managed: issue with `certbot certonly --nginx -d <host>` before enabling a new vhost.
#
#   host      the canonical server_name, and the key of its line in conf.d/app-ports-map.conf
#   port      where its Next.js listens
#   vhost_file  optional: ship roles/tenant/files/vhosts/<file> verbatim instead of the template
#   basic_auth  template only; true = auth_basic with /var/www/<domain>/.htpasswd
#   deploy_key  public half of the Environment's deploy key (private half = GitHub Environment secret SSH_KEY),
#               installed with `restrict` (no shell tricks: no pty, forwarding, agent)
#   app_jobs    optional: names from `tenant_app_jobs` this Environment runs (default: all of them)
#   noindex     optional: true = every response carries `X-Robots-Tag: noindex, nofollow` (staging; default false)
tenants:
  - name: peperoncini
    label: Pizzeria Peperoncini
    domain: pizzeria-peperoncini.ch
    environments:
      - name: production
        user: peperoncini
        db: pizzeriapeperoncini
        host: www.pizzeria-peperoncini.ch
        port: 3000
        cert: pizzeria-peperoncini.ch
        # Apex -> www redirect and the legacy product-URL redirects; not worth templating for one site.
        vhost_file: pizzeria-peperoncini.ch.conf
        deploy_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBZfhEGuNjIkauYvu+VEvceYe7RXDt2i539VtZ/inVjS peperoncini-production-deploy
      - name: staging
        user: peperoncini-staging
        db: peperoncini-staging
        host: staging.pizzeria-peperoncini.ch
        port: 3010
        cert: staging.pizzeria-peperoncini.ch
        basic_auth: false
        noindex: true
        deploy_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAII6lLdsyTxkpfUYI5K1HAZMZkuC59ZIHvN0Qd1q4kzY1 peperoncini-staging-deploy

# Each Environment's authorized_keys = these admin keys (unrestricted, for `ssh <user>@IncServer` from the admin
# Mac; the same key already reaches root through `ubuntu`, so this grants nothing new) + its `restrict`ed
# deploy key. true = anything else in the file is removed.
tenant_admin_keys:
  - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIFoNE5r0ZbY5MzrV08Fc/ULtxkWh0d7vSjPvPw34FQG8 felipe.paulmartins@outlook.com
tenant_authorized_keys_exclusive: true

# System Node 22 comes from NodeSource (role `nodejs`, delivery-order-app #554); PM2 matches the per-user installs.
nodejs_pm2_version: 6.0.11

# Scheduled app jobs (handoff step 8): delivery-order-app's POST /api/cron/<name>, on every Environment, as its user,
# against http://127.0.0.1:<port> with `Authorization: Bearer $CRON_SECRET` read from the release's env files.
# Units app-<user>-<name>.{service,timer}; `journalctl -u app-<user>-<name>`, `systemctl list-timers 'app-*'`.
#   check-pending-payments  re-validates card orders still `pending` with Wallee / SumUp (a missed webhook); no-op
#                           when none is pending. Schedule from delivery-order-app docs/payment-validation-cron.md.
#   purge-expired-tokens    data retention: deletes expired Tokens (abandoned signups' personal data). App README slot.
# Narrowing an Environment's `app_jobs` stops and removes the dropped units. Deleting a job from this list (or an
# Environment from `tenants`) does not: narrow `app_jobs` first and apply, and drop its `healthchecks_jobs` entry.
tenant_app_jobs:
  - { name: check-pending-payments, schedule: "*-*-* *:00/10:00" }
  - { name: purge-expired-tokens, schedule: "*-*-* 03:15:00" }

# Pre-deploy dumps in <home>/backups older than this many days are deleted by systemd-tmpfiles-clean (daily).
# 0 = off. Data retention (Audit L1). restic keeps a deleted dump only while a snapshot holding it is kept: 12 months
# if it was there at a month's last snapshot, else about 4 weeks (--keep-daily 7 --keep-weekly 4 --keep-monthly 12).
# Age = the newest of a dump's atime, mtime, ctime and btime (tmpfiles default), so reading or chmod-ing a dump
# restarts its clock. Not reached: refresh-staging's dir (/var/www/<domain>/backups, app repo, keeps the last 3).
tenant_backups_max_age_days: 14

# PM2 logs (<home>/.pm2/logs/*.log, pm2.log) are rotated daily by logrotate, this many days kept (gzipped
# but the newest). Rotated copies are excluded from restic (roles/backup/files/excludes.txt).
# Production's out-log grows ~20 MB a day (delivery-order-app#630) and holds customer data, so keep it short.
tenant_pm2_log_rotate: 14

# --- Backup (restic -> Infomaniak Swiss Backup cluster 04, rclone remote KuuakIncServerBackup) ----
# Script, units and excludes are shipped as they are on the box. /etc/restic/env and rclone.conf are
# templated from the vault and skipped while it has no values (see vault.yml.example).
backup_swift_auth_url: https://swiss-backup04.infomaniak.com/identity/v3

# --- healthchecks.io (handoff step 4) ---------------------------------------------
# One check per job, email integration only. A job is wired when its URL is in the vault. Check schedules to set
# on healthchecks.io (Europe/Zurich):
#   restic-backup        cron "0 0 * * *",  grace 2 h    (restic-backup.timer, daily 00:00)
#   certbot              period 1 day,      grace 2 h    (certbot.timer, 00:00 and 12:00 + up to 12 h random)
#   unattended-upgrades  cron "0 6 * * *",  grace 2 h    (apt-daily-upgrade.timer, 06:00 + up to 60 min random)
#   restic-check-data    cron "30 2 1 * *", grace 2 h    (restic-check-data.timer, 1st of the month 02:30)
healthchecks_jobs:
  - { key: restic-backup, unit: restic-backup.service, url: "{{ vault_healthcheck_backup_url | default('') }}" }
  - key: restic-check-data
    unit: restic-check-data.service
    url: "{{ vault_healthcheck_restic_check_data_url | default('') }}"
  - { key: certbot, unit: certbot.service, url: "{{ vault_healthcheck_certbot_url | default('') }}" }
  - key: unattended-upgrades
    unit: apt-daily-upgrade.service
    url: "{{ vault_healthcheck_unattended_upgrades_url | default('') }}"
    success_stamp: /var/lib/apt/periodic/upgrade-stamp
  # Production app jobs (staging: journal only). healthchecks.io: check-pending-payments cron "*/10 * * * *", grace
  # 20 min; purge-expired-tokens cron "15 3 * * *", grace 2 h.
  - key: peperoncini-check-pending-payments
    unit: app-peperoncini-check-pending-payments.service
    url: "{{ vault_healthcheck_app_job_urls['peperoncini-check-pending-payments'] | default('') }}"
  - key: peperoncini-purge-expired-tokens
    unit: app-peperoncini-purge-expired-tokens.service
    url: "{{ vault_healthcheck_app_job_urls['peperoncini-purge-expired-tokens'] | default('') }}"

# --- Login status screen (role motd) -------------------------------------------------------
# `incserver-status`, shown at login to members of `sudo` only. Environments come from `tenants`, app jobs from
# `tenant_app_jobs`, the Web line from `nginx_tool_sites`. Refresh the cache: `sudo systemctl start motd-collect`.
# The header: the banner (roles/motd/files/incserver-status.banner) with the subtitle, Ubuntu release and time beside
# it; "<name> · <subtitle>" on one line when there is no room, or when the banner's "# spells:" isn't motd_name.
motd_name: IncServer
motd_subtitle: PRODUCTION · delivery-order-app
motd_backup_label: Swiss Backup c04
motd_services:
  - { label: nginx, unit: nginx.service }
  - { label: postgres, unit: postgresql@16-main.service }
  - { label: redis, unit: redis-server.service }
  - { label: docker, unit: docker.service }
  - { label: mailpit, container: mailpit }    # compose, no unit (role mailpit)
  - { label: netdata, unit: netdata.service }
# Column header and cells of the Environment table; a job without a label shows its name.
motd_job_labels: { check-pending-payments: pay, purge-expired-tokens: purge }
# Ubuntu's parts in /etc/update-motd.d that lose their exec bit, through package upgrades too (dpkg stat override; taking
# one off this list does not undo it): the "Welcome to Ubuntu" header, help links, landscape sysinfo, motd-news ads, the
# ESM ad and update count, the 26.04 upgrade notice, the reboot notice (the screen has its own Ubuntu release, update
# count and reboot warning).
motd_stock_parts_off:
  - 00-header
  - 10-help-text
  - 50-landscape-sysinfo
  - 50-motd-news
  - 90-updates-available
  - 91-contract-ua-esm-status
  - 91-release-upgrade
  - 98-reboot-required
# While a pizzeria is open (Europe/Zurich), the screen warns: no PM2 / Postgres / Docker / ssh / journald restarts.
# Empty: the line never shows. days: Mon..Sun, a range (Tue-Sun), a list (Fri,Sat) or both (Mon,Wed-Sun);
# quoted "HH:MM", `to` later than `from`, same day (no window past midnight; the apply fails otherwise).
motd_opening_hours:
  - { days: "Mon,Wed-Sun", from: "18:00", to: "22:00" }
