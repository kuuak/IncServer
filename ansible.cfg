[defaults]
inventory = inventory/hosts.yml
roles_path = roles
interpreter_python = auto_silent
stdout_callback = default
result_format = yaml
retry_files_enabled = False
# Uncomment once group_vars/all/vault.yml is encrypted and the password is in a file outside the repo:
vault_password_file = ~/.config/incserver/vault-pass

[ssh_connection]
pipelining = True
